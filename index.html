<!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blame! Industrial Landscape Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
    
    <!-- Import map для Three.js и lil-gui -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.160.0",
        "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="loading">Загрузка...</div>
    <script type="module" src="./src/main.js"></script>
<!-- Добавьте перед закрывающим </body> -->
<div id="debug-hud" style="
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0, 0, 0, 0.7);
    color: #00ff88;
    padding: 10px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    z-index: 1000;
    pointer-events: none;
    border: 1px solid #00ff88;
    min-width: 300px;
">
    <div><b>🎮 Player State</b></div>
    <div id="hud-state">State: ...</div>
    <div id="hud-pos">Position: ...</div>
    <div id="hud-floor">Floor Y: ...</div>
    <div id="hud-grid">Grid: ...</div>
    <div id="hud-map">HeightMap size: ...</div>
</div>
</body>
</html>
